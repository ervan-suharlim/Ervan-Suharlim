<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Berita | Ervan Suharlim</title>
<meta name="description" content="Berita dan kabar terbaru dari Ervan Suharlim, desainer grafis yang berfokus pada percetakan.">
<meta name="theme-color" content="#0f3d22">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230f3d22'/%3E%3Ctext x='16' y='24' font-size='22' text-anchor='middle' fill='%239be32d' font-family='serif' font-style='italic'%3EE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--g:#9be32d;--g2:#e4f6c4;--d:#0f3d22;--ink:#0d1a12;--mut:#4f6155;--bg:#fbfdf8;--line:#dfe8d6;--serif:'Instrument Serif',Georgia,serif;--sans:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{font:300 17px/1.65 var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--d);outline-offset:3px}
.wrap{width:min(1120px,100% - 40px);margin-inline:auto}
h1,h2,h3{font-weight:400;line-height:1.05;letter-spacing:-.03em}
h2{font-size:clamp(2.1rem,5vw,3.5rem)}
.it{font:italic 400 1em/1 var(--serif);letter-spacing:-.01em}
section{padding:clamp(64px,9vw,120px) 0}
header{position:sticky;top:0;z-index:20;background:rgba(251,253,248,.88);backdrop-filter:blur(8px)}
.nav{display:flex;align-items:center;justify-content:space-between;height:70px}
.logo{font:italic 1.8rem var(--serif)}
.nav ul{display:flex;gap:2.2rem;list-style:none;padding:0;font-size:.95rem;color:var(--mut)}
.nav ul a:hover{color:var(--ink)}
.menu{display:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;place-items:center}
.menu i{display:block;width:18px;height:2px;background:var(--ink);box-shadow:0 6px 0 var(--ink);margin-bottom:6px}
.btn{display:inline-flex;align-items:center;padding:.9rem 1.7rem;border-radius:99px;background:var(--ink);color:#fff;font-weight:400;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn.o{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.hero{padding:clamp(40px,7vw,80px) 0 0;text-align:center;overflow:hidden;background:radial-gradient(90% 55% at 50% 100%,var(--g),rgba(155,227,45,0) 72%),var(--bg)}
.pill{display:inline-flex;align-items:center;gap:.6rem;padding:.45rem 1.1rem;border-radius:99px;background:#fff;box-shadow:0 0 0 1px var(--line);font-size:.92rem}
.pill:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--g);box-shadow:0 0 0 4px var(--g2)}
.hero h1{font-size:clamp(3rem,9.5vw,7.6rem);margin:1.4rem 0 1.2rem;font-weight:300}
.hero h1 .it{display:block;font-size:1.18em;margin-top:.04em}
.hero p{max-width:34rem;margin:0 auto 1.8rem;color:var(--mut);font-size:1.12rem}
.cta{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
.stack{position:relative;height:290px;max-width:700px;margin:48px auto 0}
.p{position:absolute;background:#fff;border-radius:14px;box-shadow:0 24px 40px -20px rgba(15,61,34,.5);text-align:left;overflow:hidden;animation:up 1s cubic-bezier(.2,.7,.2,1) both;transform:rotate(var(--r))}
.p i{display:block;height:7px;border-radius:4px;background:var(--line);margin:10px 0}
.nota{--r:-7deg;left:3%;bottom:-60px;width:200px;height:260px;padding:20px;border-left:3px dashed var(--g);animation-delay:.1s}
.nota b{font-weight:500;font-size:1.2rem;letter-spacing:.12em}
.kal{--r:2deg;left:50%;margin-left:-115px;bottom:-70px;width:230px;height:290px;z-index:2;animation-delay:.25s}
.kal b{display:block;background:var(--d);color:#fff;font:italic 400 1.5rem var(--serif);padding:22px 18px}
.kal div{height:110px;margin:22px 18px;background:radial-gradient(circle,var(--d) 2.2px,transparent 2.8px) 0 0/25px 20px}
.idc{--r:6deg;right:2%;bottom:-20px;width:280px;height:176px;border-top:46px solid var(--d);padding:14px 18px;animation-delay:.4s}
.idc .av{position:absolute;right:18px;top:-24px;width:54px;height:54px;border-radius:50%;background:var(--g);border:4px solid #fff}
.idc b{font-weight:500;display:block;margin-top:6px}
@keyframes up{from{opacity:0;transform:translateY(80px) rotate(var(--r))}}
.mq{overflow:hidden;padding:1rem 0;background:#fff;border-bottom:1px solid var(--line)}
.mq div{display:flex;width:max-content;animation:mq 30s linear infinite}
.mq span{display:flex;align-items:center;gap:3rem;padding-left:3rem;font:italic 1.55rem var(--serif);color:var(--d)}
.mq span:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--g)}
@keyframes mq{to{transform:translateX(-50%)}}
.about{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,72px);align-items:start}
.about p+p{margin-top:1rem}
.about p{color:var(--mut);font-size:1.1rem}
.vm{display:grid;grid-template-columns:1fr 1.25fr;gap:20px;margin-top:clamp(40px,6vw,72px)}
.vm>div{padding:clamp(24px,4vw,40px)}
.visi{background:var(--d);color:#fff;border-radius:28px 28px 28px 6px}
.misi{background:var(--g2);border-radius:6px 28px 28px 28px}
.vm h3{font:italic 400 2rem var(--serif);margin-bottom:.8rem}
.visi p{color:#d6e6da}
.misi ul{padding-left:1.1rem}.misi li{margin:.45rem 0}
.svc{display:grid;grid-template-columns:1fr 1.7fr;gap:clamp(24px,5vw,72px)}
.svc>div:first-child{position:sticky;top:100px;align-self:start}
.svc>div:first-child p{margin-top:1rem;color:var(--mut)}
.row{display:grid;grid-template-columns:150px 1fr 1.5fr;align-items:center;gap:.6rem 1.6rem;padding:1.7rem 0;border-top:1px solid var(--line)}
.row:last-child{border-bottom:1px solid var(--line)}
.row h3{font-size:1.65rem}
.row p{color:var(--mut)}
.steps{margin-top:clamp(48px,7vw,88px);background:var(--g2);border-radius:28px;padding:clamp(24px,4vw,44px);display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.steps b{font:italic 400 3.2rem/1 var(--serif);color:var(--d)}
.steps h3{font-size:1.4rem;margin:.4rem 0 .3rem}
.steps p{color:var(--mut);font-size:.98rem}
.contact{background:var(--d);color:#fff;border-radius:32px;padding:clamp(28px,6vw,72px)}
.contact h2{max-width:14em}
.contact>p{color:#cfe2d4;margin:1rem 0 2.4rem;max-width:30rem}
.links{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
.links a{display:flex;justify-content:space-between;gap:1rem;padding:1.2rem 0;border-top:1px solid rgba(255,255,255,.2);transition:color .2s,padding .2s}
.links a:hover{color:var(--g);padding-left:.6rem}
.links span{color:#a9c4b0}
.links b{font-weight:400;overflow-wrap:anywhere;text-align:right}
.th{width:150px;height:100px;border-radius:14px;background:var(--g2)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px;margin-top:2.6rem;background:#fff;color:var(--ink);border-radius:22px;padding:clamp(22px,4vw,40px)}
.form h3{font-size:1.9rem}.form h3,.form .w,.form button,.form .note{grid-column:1/-1}
.form label{display:block;font-size:.9rem;color:var(--mut)}
.form input,.form select,.form textarea{width:100%;margin-top:.35rem;padding:.8rem 1rem;border:1px solid var(--line);border-radius:12px;font:300 1rem var(--sans);color:var(--ink);background:var(--bg)}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--d);border-color:transparent}
.form button{justify-self:start;border:0;cursor:pointer;font:400 1rem var(--sans)}
.form .note{font-size:.9rem;color:var(--mut);min-height:1.2em}
.nh{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.2rem}
.nh h2{font-size:clamp(1.8rem,3.6vw,2.4rem)}
.ni{display:grid;grid-template-columns:150px 1fr;gap:.3rem 1.4rem;padding:1.2rem 0;border-top:1px solid var(--line)}
.ni:last-child{border-bottom:1px solid var(--line)}
.ni time{color:var(--mut);font-size:.92rem}
.ni h3{font-size:1.3rem}
.ni p{color:var(--mut);margin-top:.3rem}
.ni .lk{display:inline-block;margin-top:.5rem;color:var(--d);text-decoration:underline;text-underline-offset:3px}
.ni img{display:block;width:100%;max-width:520px;border-radius:14px;margin-top:1rem}
.ni iframe{display:block;width:100%;max-width:504px;height:480px;border:0;border-radius:12px;margin-top:1rem}
footer{padding:28px 0 40px;text-align:center;color:var(--mut);font-size:.9rem}
@media(max-width:820px){
.menu{display:grid}
.nav ul{display:none;position:absolute;top:70px;left:0;right:0;flex-direction:column;gap:0;background:var(--bg);padding:8px 20px 16px;border-bottom:1px solid var(--line)}
.nav.open ul{display:flex}.nav ul a{display:block;padding:.8rem 0;font-size:1.1rem}
.about,.vm,.svc,.row,.steps,.links,.ni{grid-template-columns:1fr}
.svc>div:first-child{position:static}
.form{grid-template-columns:1fr}.th{width:180px;height:120px}
}
@media(max-width:620px){.stack{transform:scale(.6);transform-origin:50% 100%;margin-top:-90px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
.nav ul a[aria-current]{color:var(--ink)}
.bh{padding:clamp(40px,7vw,88px) 0 clamp(24px,4vw,40px)}
.bh h1{font-size:clamp(2.8rem,7vw,5.4rem);font-weight:300}
.bh p{color:var(--mut);margin:1rem 0 1.6rem;max-width:34rem;font-size:1.1rem}
.bl{padding-bottom:clamp(56px,8vw,100px)}
</style>
</head>
<body>
<header><div class="wrap nav" id="nav">
<a class="logo" href="index.html">Ervan Suharlim</a>
<button class="menu" aria-label="Buka menu" aria-expanded="false" id="mb"><i></i></button>
<ul><li><a href="index.html#tentang">Tentang</a></li><li><a href="profil.html">Profil</a></li><li><a href="index.html#layanan">Layanan</a></li><li><a href="berita.html" aria-current="page">Berita</a></li><li><a href="index.html#kontak">Kontak</a></li></ul>
</div></header>
<main><div class="wrap">
<div class="bh"><h1>Berita</h1><p>Kabar dan pencapaian terbaru dari saya. Postingan lengkap juga ada di LinkedIn.</p><a class="btn" href="https://www.linkedin.com/in/ervan-suharlim" target="_blank" rel="noopener">Lihat di LinkedIn</a></div>
<div class="bl" id="nl"></div>
</div></main>
<footer>&copy; 2026 Ervan Suharlim</footer>

renderBerita(document.getElementById('nl'),0,true);
var n=document.getElementById('nav'),b=document.getElementById('mb');
b.onclick=function(){var o=n.classList.toggle('open');b.setAttribute('aria-expanded',o)};
n.querySelectorAll('ul a').forEach(function(a){a.onclick=function(){n.classList.remove('open');b.setAttribute('aria-expanded',false)}});
</script>
</body>
</html>
